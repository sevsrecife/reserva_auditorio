name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD_SALT: ${{ secrets.ADMIN_PASSWORD_SALT }}
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply RESERVAS_DB --remote

      - name: Set Cloudflare secrets
        run: |
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET --name reserva-auditorio
          printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID --name reserva-auditorio
          printf '%s' "$ADMIN_USERNAME" | npx wrangler secret put ADMIN_USERNAME --name reserva-auditorio
          printf '%s' "$ADMIN_PASSWORD_SALT" | npx wrangler secret put ADMIN_PASSWORD_SALT --name reserva-auditorio
          printf '%s' "$ADMIN_PASSWORD_HASH" | npx wrangler secret put ADMIN_PASSWORD_HASH --name reserva-auditorio

      - name: Deploy Worker
        run: npx wrangler deploy
